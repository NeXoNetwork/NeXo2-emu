name: Build Prerelease (Windows)

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*-pre*', 'v*-rc*', 'v*-beta*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (Windows x64, MSVC)
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_FEATURE_FLAGS: manifests,binarycaching

    steps:
      - name: Checkout con submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache de vcpkg (binary caching)
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/vcpkg_cache,readwrite" >> $env:GITHUB_ENV

      - name: Configurar CMake (RelWithDebInfo)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_MANIFEST_MODE=ON

      - name: Compilar
        shell: pwsh
        run: cmake --build build --config RelWithDebInfo --parallel $env:NUMBER_OF_PROCESSORS

      - name: Empaquetar artefacto
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # AJUSTA la ruta si tu binario se llama distinto:
          $exe = Get-ChildItem -Path build -Recurse -Filter "nexo2*.exe" | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName dist\ -Force }
          # Copia DLLs necesarias (vcpkg las deja en build\vcpkg_installed\...\bin)
          Get-ChildItem -Path build\vcpkg_installed -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -match '\\bin$' } |
            Copy-Item -Destination dist\ -Force -ErrorAction SilentlyContinue
          Copy-Item assets dist\ -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\* -DestinationPath nexo2-prerelease-windows-x64.zip -Force

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: nexo2-prerelease-windows-x64
          path: nexo2-prerelease-windows-x64.zip
          retention-days: 14

  publish-prerelease:
    name: Publicar prerelease en GitHub
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nexo2-prerelease-windows-x64

      - name: Crear/actualizar prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: nexo2-prerelease-windows-x64.zip
          tag_name: ${{ github.ref_name }}