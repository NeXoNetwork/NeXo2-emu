# Compilacion de Windows compartida por prerelease.yml y release-windows.yml.
# Compila con Visual Studio 2022 (todas las dependencias son submodulos: no hace falta
# vcpkg; Qt 6 se instala con install-qt-action y queda en cache), pasa los tests y deja un
# .zip con NeXo2-Qt.exe (para jugar) y NeXo2.exe (depuracion) listo para descargar.
name: Compilar (Windows)

on:
  workflow_call:
    inputs:
      version:
        description: "Version que se ve en el titulo de la ventana (NEXO2_VERSION)"
        required: true
        type: string
      package:
        description: "Nombre del .zip (sin extension)"
        required: true
        type: string

jobs:
  build:
    name: Windows x64 (MSVC, Release)
    runs-on: windows-2022
    steps:
      - name: Descargar el codigo con los submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Qt 6 (para NeXo2-Qt.exe)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configurar
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DNEXO2_VERSION=${{ inputs.version }}" "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Compilar
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Tests (interprete y JIT)
        shell: pwsh
        timeout-minutes: 20
        run: |
          build\Release\nexo2_tests.exe
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # 1 = algun test fallo (busca FAIL arriba); otro codigo = el programa revento
            # (busca [CRASH] arriba: dice en que test)
            throw ("nexo2_tests termino con el codigo {0} (0x{1:X8})" -f $code, $code)
          }

      - name: Empaquetar
        shell: pwsh
        run: |
          $dist = "dist\${{ inputs.package }}"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          if (-not (Test-Path build\Release\NeXo2-Qt.exe)) { throw "No se compilo NeXo2-Qt.exe (no se encontro Qt)" }
          Copy-Item build\Release\NeXo2-Qt.exe, build\Release\NeXo2.exe, build\Release\SDL3.dll $dist
          # Las DLL y plugins de Qt junto a NeXo2-Qt.exe
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations --no-system-d3d-compiler --no-opengl-sw "$dist\NeXo2-Qt.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt fallo" }
          Copy-Item build\Release\assets $dist -Recurse
          Copy-Item LICENSE, README.md $dist
          New-Item -ItemType Directory -Force -Path "$dist\sdmc\switch" | Out-Null   # tarjeta SD vacia: los .nro van aqui
          New-Item -ItemType Directory -Force -Path "$dist\keys" | Out-Null           # prod.keys del usuario (para NSP/XCI)
          Compress-Archive -Path $dist -DestinationPath "${{ inputs.package }}.zip"
          (Get-FileHash "${{ inputs.package }}.zip" -Algorithm SHA256).Hash.ToLower() + "  ${{ inputs.package }}.zip" |
            Out-File "${{ inputs.package }}.zip.sha256" -Encoding ascii

      - name: Guardar el paquete
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package }}
          path: |
            ${{ inputs.package }}.zip
            ${{ inputs.package }}.zip.sha256
          retention-days: 30
