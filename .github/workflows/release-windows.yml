name: Build Official Release (Windows)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-release'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag para la release (ej: v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (Windows x64, MSVC, Release)
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_FEATURE_FLAGS: manifests,binarycaching

    steps:
      - name: Checkout con submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache de vcpkg (binary caching)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-release-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-release-${{ runner.os }}-

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/vcpkg_cache,readwrite" >> $env:GITHUB_ENV

      - name: Configurar CMake (Release)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_MANIFEST_MODE=ON `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

      - name: Compilar
        shell: pwsh
        run: cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Empaquetar artefacto
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem -Path build -Recurse -Filter "nexo2*.exe" | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName dist\ -Force }
          Get-ChildItem -Path build\vcpkg_installed -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -match '\\bin$' } |
            Copy-Item -Destination dist\ -Force -ErrorAction SilentlyContinue
          Copy-Item assets dist\ -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item LICENSE,README.md,BUILDING.md dist\ -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\* -DestinationPath nexo2-release-windows-x64.zip -Force
          (Get-FileHash nexo2-release-windows-x64.zip -Algorithm SHA256).Hash |
            Out-File nexo2-release-windows-x64.zip.sha256 -Encoding ascii

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: nexo2-release-windows-x64
          path: |
            nexo2-release-windows-x64.zip
            nexo2-release-windows-x64.zip.sha256

  publish-release:
    name: Publicar release oficial en GitHub
    needs: build-windows
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nexo2-release-windows-x64

      - name: Crear release oficial
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          draft: false
          generate_release_notes: true
          files: |
            nexo2-release-windows-x64.zip
            nexo2-release-windows-x64.zip.sha256
          tag_name: ${{ github.ref_name }}