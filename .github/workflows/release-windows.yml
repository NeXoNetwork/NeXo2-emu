# Release oficial: SOLO cuando tu la lanzas a mano.
# GitHub -> Actions -> "Release oficial" -> Run workflow -> escribe la version (ej. 0.0.3).
# Compila, pasa los tests, crea el tag v<version> en el ultimo commit de la rama elegida
# y publica la release con las notas desde la release oficial anterior.
name: Release oficial

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (sin la v), por ejemplo 0.0.3"
        required: true
        type: string
      draft:
        description: "Crearla como borrador (la publicas tu despues desde GitHub)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Comprobar version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      package: ${{ steps.v.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          ver="${{ inputs.version }}"
          ver="${ver#v}"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La version debe ser como 0.0.3 (recibido: '${{ inputs.version }}')"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "::error::El tag v$ver ya existe"; exit 1
          fi
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "package=NeXo2-v$ver-windows-x64" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ inputs.version }}
      package: ${{ needs.check.outputs.package }}

  publish:
    name: Publicar release
    needs: [ check, build ]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.check.outputs.package }}
          path: out

      - name: Crear la release
        run: |
          tag="${{ needs.check.outputs.tag }}"
          # Notas desde la ultima release oficial (sin contar las -dev)
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | head -n 1 || true)
          args=(--target "$GITHUB_SHA" --title "NeXo 2 $tag" --generate-notes --latest)
          [ -n "$prev" ] && args+=(--notes-start-tag "$prev")
          [ "${{ inputs.draft }}" = "true" ] && args+=(--draft)
          gh release create "$tag" out/*.zip out/*.zip.sha256 "${args[@]}"
