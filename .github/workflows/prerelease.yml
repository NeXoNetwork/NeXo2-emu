# Prerelease automatica: cada commit que llega a main se compila, se prueba y se publica
# como prerelease en GitHub (tag v<version>-dev.<numero>). Solo se guardan las 10 ultimas.
# Los pull requests solo se compilan y prueban (no se publica nada).
name: Prerelease

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# Si llegan varios commits seguidos, solo se termina el ultimo
concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      package: ${{ steps.v.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(sed -n 's/^set(NEXO2_VERSION "\([^"]*\)".*/\1/p' CMakeLists.txt)
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "version=${base}-dev.${GITHUB_RUN_NUMBER}+${short}" >> "$GITHUB_OUTPUT"
          echo "tag=v${base}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "package=NeXo2-v${base}-dev.${GITHUB_RUN_NUMBER}-windows-x64" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
      package: ${{ needs.version.outputs.package }}

  publish:
    name: Publicar prerelease
    needs: [ version, build ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.version.outputs.package }}

      - name: Crear la prerelease
        run: |
          tag="${{ needs.version.outputs.tag }}"
          msg=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.message' | sed -n '1,20p')
          {
            echo "Compilacion automatica del commit ${GITHUB_SHA:0:7}. **No es una version estable.**"
            echo
            echo '```'
            echo "$msg"
            echo '```'
            echo
            echo "Descomprime el .zip, pon tus .nro en sdmc/switch y abre NeXo2.exe."
          } > notes.md
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true   # por si se repite la ejecucion
          gh release create "$tag" *.zip *.zip.sha256 \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "NeXo 2 ${{ needs.version.outputs.version }}" --notes-file notes.md

      - name: Borrar prereleases viejas (se quedan las 10 ultimas)
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-dev\\.")))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
          while read -r old; do
            echo "Borrando $old"
            gh release delete "$old" --yes --cleanup-tag
          done
